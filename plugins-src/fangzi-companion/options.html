<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>方子助手 · 设置</title>
    <link rel="stylesheet" href="popup.css" />
    <style>
      body {
        width: 420px;
        margin: 40px auto;
        float: none;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" alt="" width="28" height="28" />
      <h1>方子助手设置</h1>
    </header>
    <label class="field">
      方子站点地址
      <input id="siteUrl" type="text" placeholder="如 https://fangzi.example.com" />
    </label>
    <label class="field">
      高级版授权码（可选）
      <input id="licenseKey" type="text" placeholder="购买 AI 解读后获得" />
    </label>
    <div class="row">
      <button id="save" class="primary">保存设置</button>
    </div>
    <p id="status" class="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
